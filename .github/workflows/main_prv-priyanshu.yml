name: Build and deploy Node.js app to Azure Web App - prv-priyanshu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Checks
        run: npm run lint

      - name: Build Next.js Production App
        run: npm run build

      - name: Prepare Deployment Package
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          rm -rf node_modules

      - name: Upload Deployment Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !.git
            !.github
            !.next/cache

  deploy:
    name: Deploy to Azure Web App (Production)
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: azure-app-service-production-slot
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C0426DA35F63405FAD45E89A3687C7AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC9D1828773743359A81B48D7940284F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34D33BF0781A4E3087C25390036547DE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'prv-priyanshu'
          slot-name: 'Production'
          package: .